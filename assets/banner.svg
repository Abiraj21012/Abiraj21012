<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.5" fill="#6C63FF"/></pattern>
<linearGradient id="fadeL" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
<linearGradient id="fadeR" x1="0" x2="1"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient>
<mask id="mL"><rect x="0" y="0" width="260" height="240" fill="url(#fadeL)"/></mask>
<mask id="mR"><rect x="640" y="0" width="260" height="240" fill="url(#fadeR)"/></mask>
<linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#6C63FF"/><stop offset="1" stop-color="#00D4FF"/></linearGradient>
</defs>
<rect width="900" height="240" rx="14" fill="#0d1117"/>
<rect x="0" y="0" width="260" height="240" fill="url(#dots)" mask="url(#mL)" opacity="0.85"/>
<rect x="640" y="0" width="260" height="240" fill="url(#dots)" mask="url(#mR)" opacity="0.85"/>
<rect x="250" y="35" width="400" height="170" rx="6" fill="#0d1117" stroke="#c9d1d9" stroke-width="3"/>
<rect x="250" y="35" width="400" height="26" rx="6" fill="url(#bar)" opacity="0.9"/>
<rect x="262" y="43" width="10" height="10" fill="#0d1117"/><rect x="278" y="43" width="10" height="10" fill="#0d1117"/><rect x="294" y="43" width="10" height="10" fill="#0d1117"/>
<text x="450" y="53" fill="#0d1117" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">abiraj@data-engineer: ~</text>
<text x="285" y="105" fill="#c9d1d9" font-family="'Fira Code',Consolas,monospace" font-size="15" opacity="0">$ python etl_pipeline.py
<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.05;0.09;0.93;1"/></text>
<text x="285" y="129" fill="#8b949e" font-family="'Fira Code',Consolas,monospace" font-size="15" opacity="0">> extracting raw data...
<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.18;0.22;0.93;1"/></text>
<text x="285" y="153" fill="#8b949e" font-family="'Fira Code',Consolas,monospace" font-size="15" opacity="0">> cleaning + transforming...
<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.31;0.35;0.93;1"/></text>
<text x="285" y="177" fill="#6C63FF" font-family="'Fira Code',Consolas,monospace" font-size="15" opacity="0">> SELECT insights FROM data;
<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.44;0.48;0.93;1"/></text>
<text x="285" y="201" fill="#3fb950" font-family="'Fira Code',Consolas,monospace" font-size="15" opacity="0">✔ pipeline complete
<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.57;0.61;0.93;1"/></text>

<rect x="285" y="205" width="9" height="2" fill="#6C63FF"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
</svg>
